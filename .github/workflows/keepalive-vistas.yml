name: Mantener vivos links de vids.st / Playmate

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [nuevos-links-vidsst-playmate]

concurrency:
  group: keepalive-vistas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      hayTrabajo: ${{ steps.plan.outputs.hayTrabajo }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calcular que links estan debidos hoy
        id: plan
        run: node scripts/plan-vistas.mjs

      - name: Guardar altas nuevas en vistas-estado.json
        run: |
          if ! git diff --quiet -- vistas-estado.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add vistas-estado.json
            git commit -m "Plan: registrar links nuevos detectados hoy"
            git push
          fi

  vistas:
    needs: plan
    if: needs.plan.outputs.hayTrabajo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Instalar Chromium
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Escribir la porcion de links de este job
        run: echo '${{ toJson(matrix.chunk.urls) }}' > urls-a-procesar.json

      - name: Darle vista a esta porcion
        env:
          ARCHIVO_URLS_A_PROCESAR: urls-a-procesar.json
          ARCHIVO_RESULTADOS: resultados.json
          SEGUNDOS_REPRODUCCION: '180'
          CONCURRENCIA: '3'
        run: node scripts/keepalive-vistas.mjs

      - name: Subir resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.chunk.indice }}
          path: resultados.json
          retention-days: 7

      - name: Subir capturas de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-sin-video-${{ matrix.chunk.indice }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

  guardar:
    needs: [plan, vistas]
    if: always() && needs.plan.outputs.hayTrabajo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bajar resultados de todos los jobs
        uses: actions/download-artifact@v4
        with:
          pattern: resultados-*
          path: resultados-descargados

      - name: Actualizar ultimaVista
        run: node scripts/guardar-estado.mjs

      - name: Commitear estado final
        run: |
          if ! git diff --quiet -- vistas-estado.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add vistas-estado.json
            git commit -m "Actualizar fechas de ultima vista"
            git push
          fi
